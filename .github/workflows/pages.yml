name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: talksprout-production-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir mcp install --frozen-lockfile
      - name: Validate sources
        run: |
          pnpm sync
          git diff --exit-code -- content distribution skills mcp/package.json
          pnpm format:check
          pnpm docs:check
          pnpm mcp:typecheck
      - name: Run unit tests
        run: |
          pnpm test
          pnpm mcp:test
      - name: Build app and MCP
        run: |
          pnpm build
          pnpm mcp:build
      - name: Install Playwright browser (chromium)
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        run: pnpm test:e2e
      - run: pnpm release:preflight
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: mcp-build
          path: mcp/.cloudflare/output/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: ai-release
          path: public/downloads/
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-mcp:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment: mcp-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir mcp install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mcp-build
          path: mcp/.cloudflare/output/
      - uses: actions/download-artifact@v4
        with:
          name: ai-release
          path: public/downloads/
      - run: pnpm --dir mcp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: pnpm mcp:smoke "$MCP_ENDPOINT" public/downloads/release-manifest.json
        env:
          MCP_ENDPOINT: ${{ vars.MCP_ENDPOINT }}
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [deploy, deploy-mcp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ai-release
          path: public/downloads/
      - run: python3 scripts/publish-ai.py publish
        env:
          GH_TOKEN: ${{ github.token }}
